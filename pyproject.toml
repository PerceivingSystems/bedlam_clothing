[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = { include = ["bedlam_clothing*", "scripts*"] }

[project]
name = "bedlam_clothing"
version = "0.2.0"
description = "Processing tools for the BEDLAM2.0 dataset assets"
authors = [
    { name = "Giorgio Becherini", email = "giorgio.becherini@tuebingen.mpg.de" }
]
readme = "README.md"
requires-python = ">=3.11, <3.12"
license = { file = "LICENSE.md" }
keywords = ["bedlam", "bedlam2", "clothing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]

# Only the packages the code imports. Everything else is left to the resolver.
# Upper bounds mark known breaks: numpy 2 changes the ABI that the torch 2.5 and
# bpy 4.2 wheels were built against, and Blender 5 moves off Python 3.11.
# Exact pins mark versions the repository is tied to. bpy 4.2 is the Blender
# release that wrote bedlam_clothing/shoes/shoeTexture.blend, and it is what holds
# requires-python to 3.11. numpy 2 changes the ABI that the torch and bpy wheels
# are built against. The git dependencies are not on PyPI, so they carry a commit.
# The rest take a lower bound and let the resolver choose.
dependencies = [
    "bomoto @ git+https://github.com/PerceivingSystems/bomoto.git@6a0ec31",
    "bpy==4.2.0",
    "loguru>=0.7",
    "numpy>=1.23,<2",
    "omegaconf>=2.3",
    "smplx @ git+https://github.com/vchoutas/smplx@566532a",
    "torch>=2.5",
    "trimesh>=4.0",
]

[project.urls]
"Homepage" = "https://bedlam2.is.tuebingen.mpg.de/"
"Source Code" = "https://github.com/PerceivingSystems/bedlam_clothing"
"Issue Tracker" = "https://github.com/PerceivingSystems/bedlam_clothing/issues"
